apiVersion: v1
kind: Service
metadata:
  name: agent-relay
  labels:
    app.kubernetes.io/name: agent-relay
    app.kubernetes.io/part-of: agent-relay
spec:
  selector:
    app.kubernetes.io/name: agent-relay
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-relay
  labels:
    app.kubernetes.io/name: agent-relay
    app.kubernetes.io/part-of: agent-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-relay
        app.kubernetes.io/part-of: agent-relay
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef:
                name: agent-relay-postgres
          command:
            - /bin/sh
            - -c
            - until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do sleep 2; done
      containers:
        - name: agent-relay
          image: agent-relay:kind
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: agent-relay-postgres
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: agent-relay-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: agent-relay-postgres
                  key: POSTGRES_PASSWORD
            - name: RELAY_DATABASE_URL
              value: postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres:5432/$(POSTGRES_DB)
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
